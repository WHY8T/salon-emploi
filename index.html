<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salon de l’Emploi 2026 | EIC Club</title>
  <meta name="description"
    content="Une journée, une soixantaine d’entreprises, des recruteurs face à vous. Ouvrez la lettre du club EIC et suivez les indices.">
  <meta name="theme-color" content="#0d0b0b">
  <!-- Open Graph: replace YOUR-DOMAIN with the real URL once hosted (previews need an absolute URL) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="Salon de l’Emploi | EIC Club">
  <meta property="og:title" content="Salon de l’Emploi 2026 : une lettre vous attend">
  <meta property="og:description"
    content="Une journée, une soixantaine d’entreprises, des recruteurs face à vous. Ouvrez la lettre du club EIC.">
  <meta property="og:image" content="https://YOUR-DOMAIN/assets/images/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/images/logo-eic.png">
  <link rel="preload" as="image" href="assets/images/crow.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600&family=Cairo:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400..600&display=swap">
  <script>
    /* Marks JS as available (CSS pre-hides animated parts). Failsafe: if animation never starts, show everything. */
    document.documentElement.classList.add("js");
    setTimeout(function () { var c = document.documentElement.classList; if (!c.contains("ready")) c.add("no-anim") }, 7000);
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>

  <!-- Inline icon sprite (Lucide, 24px line icons). Copy also lives in assets/icons/sprite.svg -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-route" viewBox="0 0 24 24">
        <circle cx="6" cy="19" r="3" />
        <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
        <circle cx="18" cy="5" r="3" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 9.9-1" />
      </symbol>
      <symbol id="i-landmark" viewBox="0 0 24 24">
        <line x1="3" x2="21" y1="22" y2="22" />
        <line x1="6" x2="6" y1="18" y2="11" />
        <line x1="10" x2="10" y1="18" y2="11" />
        <line x1="14" x2="14" y1="18" y2="11" />
        <line x1="18" x2="18" y1="18" y2="11" />
        <polygon points="12 2 20 7 4 7" />
      </symbol>
      <symbol id="i-building" viewBox="0 0 24 24">
        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
        <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2" />
        <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2" />
        <path d="M10 6h4" />
        <path d="M10 10h4" />
        <path d="M10 14h4" />
        <path d="M10 18h4" />
      </symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24">
        <path d="M10 2v2" />
        <path d="M14 2v2" />
        <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" />
        <path d="M6 2v2" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M12 7v14" />
        <path
          d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
      </symbol>
      <symbol id="i-tree" viewBox="0 0 24 24">
        <path
          d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z" />
        <path d="M12 22v-3" />
      </symbol>
      <symbol id="i-compass" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
      </symbol>
      <symbol id="i-map" viewBox="0 0 24 24">
        <path
          d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z" />
        <path d="M15 5.764v15" />
        <path d="M9 3.236v15" />
      </symbol>
      <symbol id="i-key" viewBox="0 0 24 24">
        <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4" />
        <path d="m21 2-9.6 9.6" />
        <circle cx="7.5" cy="15.5" r="5.5" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path
          d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-flag" viewBox="0 0 24 24">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
        <line x1="4" x2="4" y1="22" y2="15" />
      </symbol>
    </defs>
  </svg>

  <!-- Intro overlay (burgundy panel, white logo drawn in by a sliding cover) -->
  <div class="intro" aria-hidden="true">
    <div class="intro-logo"><img src="assets/images/logo-eic-light.png" width="1011" height="693" alt=""><span
        class="intro-cover"></span></div>
    <span class="intro-rule"></span>
  </div>

  <!-- Crow scene: fixed background. Feathers + radar rings + pulses around the red eye (see animations.js) -->
  <div class="bg-crow" aria-hidden="true">
    <div class="feathers" data-feathers></div>
    <div class="crow-scroll">
      <div class="crow-pointer">
        <div class="eye-anchor">
          <svg class="rings" viewBox="-200 -200 400 400" fill="none">
            <g class="ring-fixed">
              <circle r="40" />
              <circle r="80" />
              <circle r="120" />
              <circle r="160" />
              <circle r="200" />
              <path d="M-200 0H200M0 -200V200" class="cross" />
            </g>
            <g class="ring-a">
              <circle r="140" class="dash" />
            </g>
            <g class="ring-b">
              <circle r="180" class="tick" />
            </g>
          </svg>
          <span class="pulse"></span><span class="pulse"></span>
        </div>
        <picture>
          <source srcset="assets/images/crow.webp" type="image/webp">
          <img src="assets/images/crow.png" width="1209" height="1301" alt="" fetchpriority="high" decoding="async">
        </picture>
        <span class="eye"></span>
      </div>
    </div>
  </div>

  <a class="skip" href="#main" data-i18n="skip">Aller au contenu</a>

  <header class="site-header reveal">
    <a class="brand" href="#main" aria-label="Salon de l’Emploi, EIC Club">
      <img src="assets/images/logo-eic.png" width="44" height="30" alt="">
      <span>Salon de l’Emploi</span>
    </a>
    <div class="head-right">
      <p class="edition" data-i18n="edition"></p>
      <!-- Language switcher (texts in js/config.js > i18n) -->
      <div class="lang" role="group" aria-label="Langue / Language / اللغة">
        <button type="button" data-lang="fr" aria-pressed="true">FR</button>
        <button type="button" data-lang="ar" aria-pressed="false" lang="ar">AR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="main" class="stage">

    <!-- 1. Countdown -->
    <section class="countdown reveal" aria-labelledby="cd-title" data-countdown data-phase="before">
      <h1 id="cd-title" class="cd-title" data-i18n="cdTitle"></h1>
      <p class="cd-meta" data-i18n="eventLabel"></p>
      <div class="cd-grid" role="timer" aria-live="off">
        <div class="cd-unit" data-unit="days">
          <div class="cd-digits" aria-hidden="true"></div><span class="cd-label" data-i18n="days"></span>
        </div>
        <div class="cd-unit" data-unit="hours">
          <div class="cd-digits" aria-hidden="true"></div><span class="cd-label" data-i18n="hours"></span>
        </div>
        <div class="cd-unit" data-unit="minutes">
          <div class="cd-digits" aria-hidden="true"></div><span class="cd-label" data-i18n="minutes"></span>
        </div>
        <div class="cd-unit" data-unit="seconds">
          <div class="cd-digits" aria-hidden="true"></div><span class="cd-label" data-i18n="seconds"></span>
        </div>
        <span class="sr-only" data-sr></span>
      </div>
      <p class="cd-state" data-state></p>
    </section>

    <!-- 2. Letter -->
    <section class="letter reveal" aria-labelledby="letter-title">
      <figure class="letter-photo" aria-hidden="true">
        <!-- Save the site's speaker photo as assets/images/speaker.webp. Until then the site's own copy is used as fallback. -->
        <img src="assets/images/speaker.webp"
          onerror="this.onerror=null;this.src='https://salon.eicclub.org/images/hero-speaker.webp'" width="800"
          height="1000" alt="" decoding="async">
      </figure>
      <article class="letter-body">
        <h2 id="letter-title" class="sr-only">Lettre du club EIC</h2>
        <div data-letter></div>
      </article>
      <button class="btn-suivi" type="button" aria-haspopup="dialog" aria-controls="drawer" aria-expanded="false"
        data-open-hints>
        <span data-i18n="suivi"></span>
        <svg class="icon" aria-hidden="true">
          <use href="#i-route" />
        </svg>
      </button>
    </section>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer"></p>
    <a href="https://salon.eicclub.org/fr">salon.eicclub.org</a>
  </footer>

  <!-- 3. Hints: full-page overlay (two curtains wipe up), 10 sealed envelopes, and a reader where one opens -->
  <div class="drawer-root" data-drawer-root hidden>
    <div class="curtain curtain-a"></div>
    <div class="curtain curtain-b"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-inner">
        <header class="drawer-head">
          <div>
            <h2 id="drawer-title" data-i18n="drawerTitle"></h2>
            <p data-progress role="status"></p>
          </div>
          <button class="icon-btn" type="button" data-close data-i18n-aria="close"><svg class="icon" aria-hidden="true">
              <use href="#i-x" />
            </svg></button>
        </header>
        <ol class="hint-list" data-hint-list></ol>
      </div>
    </aside>
    <!-- Envelope reader: seal breaks, flap opens, letter slides out -->
    <div class="reader" data-reader hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <button class="icon-btn reader-close" type="button" data-reader-close data-i18n-aria="close"><svg class="icon"
          aria-hidden="true">
          <use href="#i-x" />
        </svg></button>
      <div class="eb">
        <div class="eb-back"></div>
        <div class="eb-flap"></div>
        <article class="eb-paper"><span class="eb-num"></span>
          <h3 id="reader-title"></h3>
          <p></p>
        </article>
        <div class="eb-front"></div>
        <span class="eb-seal"><svg class="icon" aria-hidden="true">
            <use href="#i-lock" />
          </svg></span>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/countdown.js" defer></script>
  <script src="js/hints.js" defer></script>
  <script src="js/animations.js" defer></script>
  <script src="js/main.js" defer></script>
</body>

</html>
